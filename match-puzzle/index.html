<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

        <div id="upper">MATCH-PUZZLE</div>

            <div id="history"></div>

                    <div id="time">TIME:<span id="timeSpan"></span></div>
                    <button class="restart">Restart</button>
                </div>
                <div id="bottom">
                    <button class="buttons">
                        <div id="box1"></div>
                    </button>
                    <button class="buttons">
                        <div id="box2"></div>
                    </button>
                    <button class="buttons">
                        <div id="box3"></div>
                    </button>
                    <button class="buttons">
                        <div id="box4"></div>
                    </button>
                    <button class="buttons">
                        <div id="box5"></div>
                    </button>
                    <button class="buttons">
                        <div id="box6"></div>
                    </button>
                    <button class="buttons">
                        <div id="box7"></div>
                    </button>
                    <button class="buttons">
                        <div id="box8"></div>
                    </button>
                    <button class="buttons">
                        <div id="box9"></div>
                    </button>
                    <button class="buttons">
                        <div id="box10"></div>
                    </button>
                    <button class="buttons">
                        <div id="box11"></div>
                    </button>
                    <button class="buttons">
                        <div id="box12"></div>
                    </button>
                    <button class="buttons">
                        <div id="box13"></div>
                    </button>
                    <button class="buttons">
                        <div id="box14"></div>
                    </button>
                    <button class="buttons">
                        <div id="box15"></div>
                    </button>
                    <button class="buttons">
                        <div id="box16"></div>
                    </button>
                </div>
            </div>
            <div id="result" style="display: none;" >
                <div id="content">
                    <div>Total Moves:<span id="resultmoves"></span></div>
                    <div>Total Time Taken:<span id="resultTime"></span> </div>
                    <div>Score: <span id="score"></span></div>
                    <div>Rating: <span id="rating"></span></div>
                    <div><button class="restart">Restart</button></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js">

    </script>
</body>

</html>
