<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Difference: input vs change</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input { padding: 5px; font-size: 16px; }
    .log { margin-top: 15px; font-family: monospace; }
  </style>
</head>
<body>

  <h2>Type in the box:</h2>
  <input type="text" id="myInput" placeholder="Start typing...">
  
  <div class="log" id="log"></div>

  <script>
    const inputEl = document.getElementById('myInput');
    const logEl = document.getElementById('log');

    // Helper to append logs
    function logEvent(type, value) {
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `[${time}] ${type}: "${value}"<br>`;
    }

    // Fires on every keystroke or value change
    inputEl.addEventListener('input', () => {
      logEvent('input event', inputEl.value);
    });

    // Fires only when focus is lost and value changed
    inputEl.addEventListener('change', () => {
      logEvent('change event', inputEl.value);
    });
  </script>

</body>
</html>
