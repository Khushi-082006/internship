<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calc.css">


</head>

<body>
    <div id="mainframe">
        <div id="display">
            <div id="equation">
            </div>
            <div id="result">
            </div>
        </div>
        <div id="keys">
            <button id="clear-all" onclick="clearEquation()">C</button>
            <button id="backspace"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-delete-icon lucide-delete">
                    <path
                        d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z" />
                    <path d="m12 9 6 6" />
                    <path d="m18 9-6 6" />
                </svg></button>
            <button id="equal">=</button>
            <button id="modulas" class="operator">%</button>


            <button id="one" class="number">1</button>
            <button id="two" class="number">2</button>
            <button id="three" class="number">3</button>

            <button id="addition" class="operator">+</button>
            <button id="four" class="number">4</button>
            <button id="five" class="number">5</button>
            <button id="six" class="number">6</button>


            <button id="subtraction" class="operator">-</button>
            <button id="seven" class="number">7</button>
            <button id="eight" class="number">8</button>
            <button id="nine" class="number">9</button>

            <button id="product" class="operator">*</button>
            <button id="zero" class="number">0</buttton>
                <button id="doublezero" class="number">00</buttton>

                    <button id="division" class="operator">/</button>
                    <button id="decimal" class="decimal">.</button>
        </div>

        <script>
            let equation = document.getElementById("equation");
            let operator = document.querySelectorAll(".operator");
            let number = document.querySelectorAll(".number");
            let backspace = document.getElementById("backspace");
            let result = document.getElementById("result");

            number.forEach((num) => {
                num.addEventListener("click", () => {
                    let splitedEquation = equation.innerText.split(/[\+\-\*\/%]/);
                    let lastNumber = splitedEquation[splitedEquation.length - 1];
                    let digit = num.innerText;
                    if ((lastNumber === "0" && digit === "0") || (lastNumber === "00" && digit === "00")) {
                        return;
                    }
                    if ((lastNumber === "0" && digit != "." && digit != "0")) {
                        equation.innerText = equation.innerText.slice(0, -1) + digit;
                    }
                    else if ((lastNumber === "00" && digit != "." && digit != "00")) {
                        equation.innerText = equation.innerText.slice(0, -2) + digit;
                    }
                    else {
                        equation.innerText += digit;
                    }
                    let lastChar = equation.innerText.slice(-1);
                    if (!isNaN(lastChar)) {
                        result.innerText = eval(equation.innerText);
                    } else {
                        result.innerText = "";
                    }
                })
            });

            operator.forEach((op) => {
                op.addEventListener("click", () => {
                    let lastChar = equation.innerText.slice(-1);
                    if( equation.innerText==="" && op.innerText!=="-"){
                        return;
                    }
                    if (lastChar === ".") {
                        return;
                    }
                    if (!["+", "-", "*", "/", "%"].includes(lastChar)) {
                        equation.innerText += op.innerText;
                    }
                    else {
                        equation.innerText = equation.innerText.slice(0, -1) + op.innerText;
                    }

                })
            });
            function clearEquation() {
                equation.innerText = "";
                result.innerText = "";
            }

            backspace.addEventListener("click", () => {
                if (equation.innerText) {
                    equation.innerText = equation.innerText.slice(0, -1);
                    let lastChar = equation.innerText.slice(-1);
                    if (!["+", "-", "*", "/", "%"].includes(lastChar)) {
                        result.innerText = eval(equation.innerText);
                    }
                    else {
                        let val = equation.innerText.slice(0, -1);
                        result.innerText = eval(val);

                    }
                    if (!(equation.innerText)) {
                        result.innerText = "";
                    }

                }
            });

            equal.addEventListener("click", () => {
                if (equation.innerText) {
                    result.innerText = eval(equation.innerText);
                    equation.innerText = "";
                }

            });
            decimal.addEventListener("click", () => {
                let lastChar=equation.innerText.slice(-1);
                if (["+", "-", "*", "/", "%"].includes(lastChar)) {
                    console.log("1");
                        equation.innerText+="0."; return;
                    }

                let splitedEquation = equation.innerText.split(/[\+\-\*\/%]/);
                let lastNumber = splitedEquation[splitedEquation.length - 1];
                if (!lastNumber.includes(".")) {
                    equation.innerText += ".";
                }
                
            })









        </script>

</body>

</html>
