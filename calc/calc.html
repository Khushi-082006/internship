<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calc.css">


</head>

<body>
    <div id="mainframe">
        <div id="display">
            <div id="equation">
            </div>
            <div id="result">
            </div>
        </div>
        <div id="keys">
            <button id="clear-all" onclick="clearEquation()">C</button>
            <button id="backspace"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-delete-icon lucide-delete">
                    <path
                        d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z" />
                    <path d="m12 9 6 6" />
                    <path d="m18 9-6 6" />
                </svg></button>
            <button id="equal">=</button>
            <button id="modulas" class="operator">%</button>


            <button id="one" class="number">1</button>
            <button id="two" class="number">2</button>
            <button id="three" class="number">3</button>

            <button id="addition" class="operator">+</button>
            <button id="four" class="number">4</button>
            <button id="five" class="number">5</button>
            <button id="six" class="number">6</button>


            <button id="subtraction" class="operator">-</button>
            <button id="seven" class="number">7</button>
            <button id="eight" class="number">8</button>
            <button id="nine" class="number">9</button>

            <button id="product" class="operator">*</button>
            <button id="zero" class="number">0</button>
            <button id="doublezero" class="number">00</button>

            <button id="division" class="operator">/</button>
            <button id="decimal" class="decimal">.</button>
        </div>

        <script src="calc.js">


        </script>

</body>

</html>
