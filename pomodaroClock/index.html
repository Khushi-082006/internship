<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">     
    
</head>

<body>
    <div id="container">
        <div id="upper">25

        </div>
        <div id="lower">
            <div id="session"><span id="mode-text">Session </span><span id="session-span">0</span></div>
            <div id="times">
                <div id="session-time">
                    <h4>Session</h4>
                    <h3 id="session-time1">25</h3>
                    <button id="minus-session">-</button>
                    <button id="plus-session">+</button>
                </div>
                <div id="break-time">
                    <h4>Break</h4>
                    <h3 id="break-time1">5</h3>
                    <button id="minus-break">-</button>
                    <button id="plus-break">+</button>
                </div>
            </div>
            <div id="button">
                <div>
                    <button id="start">Start</button>
                </div>
                <div>
                    <button id="reset">Reset</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js">
       
    </script>
</body>

</html>
